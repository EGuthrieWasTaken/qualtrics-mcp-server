name: Docker image

# Every run builds each platform, smoke-tests it, and builds the multi-platform
# image. Only pushes to main and v* tags then publish it to GitHub Container
# Registry; pull requests never do.
# The only credential is the GITHUB_TOKEN GitHub provides to every run.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - tsconfig.json
      - tsconfig.build.json
      - src/**
      - scripts/docker-smoke-test.sh
      - .github/workflows/docker.yml
  push:
    branches: [main]
    tags: ["v*"]
    # Changes that cannot alter the image should not move :latest. Tag pushes ignore path filters.
    paths-ignore:
      - "**.md"
      - docs/**
      - tests/**
      - unraid/**
      - docker-compose.example.yml
      - .env.example
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Platforms to build and publish. Everything except linux/amd64 builds and
  # runs under QEMU on the amd64 runner, which is slower.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      # Publish only from main and from version tags, never from pull requests or other branches.
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: contains(env.PLATFORMS, 'arm64')
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: qualtrics-mcp-server:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          provenance: false

      - name: Smoke test linux/amd64
        run: ./scripts/docker-smoke-test.sh qualtrics-mcp-server:ci

      - name: Build linux/arm64 for the smoke test
        if: contains(env.PLATFORMS, 'arm64')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: qualtrics-mcp-server:ci-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          provenance: false

      - name: Smoke test linux/arm64 (emulated)
        if: contains(env.PLATFORMS, 'arm64')
        env:
          SMOKE_STARTUP_TIMEOUT: "120"
        run: ./scripts/docker-smoke-test.sh qualtrics-mcp-server:ci-arm64

      - name: Set image name
        if: env.PUBLISH == 'true'
        id: image
        # Registry paths must be lowercase; the repository owner may not be.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # On pull requests this builds every platform without pushing, so a
      # broken build for any of them is caught before the merge.
      - name: Build all platforms (and push when publishing)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Only the labels that depend on this run. The description and
          # license labels come from the Dockerfile.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Reuse the per-platform builds above; do not overwrite their caches.
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          # Attestation manifests add an unknown/unknown entry to the image
          # index, which some pull tools handle poorly.
          provenance: false

      - name: Summarize
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
